name: CI

# GitHub-hosted runners have NO GPU. Nothing in this workflow exercises a model on an
# accelerator, and the docs must not imply otherwise (PROJECT_CONTEXT.md section 7).

on:
  push:
  pull_request:
  schedule:
    # Nightly, for the gated inference job only.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Exactly the two environments uv.lock resolves for (PROJECT_CONTEXT.md section 7).
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync from the lockfile
        # --locked fails rather than re-resolving: a lockfile that has drifted from
        # pyproject.toml must be a CI failure, not a silent update.
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

  inference-cpu:
    # Runs the P5 gate: determinism, sequence log-probs, and the resumable harness, on CPU.
    #
    # It loads a model, but a TINY one. `hf-internal-testing/tiny-random-LlamaForCausalLM` is a few
    # megabytes, randomly initialised, and ungated -- which matters because this job has no HF
    # token and therefore cannot reach the gated Meta pins the dev box uses. Its outputs are
    # meaningless by construction, and that is fine: these tests check the HARNESS, not the model.
    #
    # There is still NO GPU here (PROJECT_CONTEXT.md section 7). The NF4 path is exercised on
    # Kaggle, never in CI, and the docs must not imply otherwise. On this runner the backend falls
    # back to an unquantized load and records that it did.
    name: inference extra (CPU only, no GPU on GitHub runners)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'inference-ci')
    env:
      MARGINS_TEST_MODEL: tiny_random_llama
      # Pinned: the determinism claim holds at a FIXED thread count, so a runner that varies its
      # core count would make the claim uncheckable rather than false.
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync with the inference extra
        run: uv sync --locked --extra dev --extra inference

      - name: Report the environment the determinism claim depends on
        run: uv run python -c "import torch, transformers; print(torch.__version__, transformers.__version__, torch.get_num_threads())"

      - name: pytest (includes the inference-marked P5 gate tests)
        run: uv run pytest -q
