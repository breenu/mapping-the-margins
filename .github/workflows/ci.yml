name: CI

# GitHub-hosted runners have NO GPU. Nothing in this workflow exercises a model on an
# accelerator, and the docs must not imply otherwise (PROJECT_CONTEXT.md section 7).

on:
  push:
  pull_request:
  schedule:
    # Nightly, for the gated inference job only.
    - cron: "0 3 * * *"
  # On demand, so the gated inference job can be VERIFIED after a change to it rather than only
  # observed the next morning. Without this, a fix to that job has a ~24h feedback loop and the
  # temptation is to assume it worked.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Exactly the two environments uv.lock resolves for (PROJECT_CONTEXT.md section 7).
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync from the lockfile
        # --locked fails rather than re-resolving: a lockfile that has drifted from
        # pyproject.toml must be a CI failure, not a silent update.
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

      - name: Regenerate every figure from the committed tables
        # The P10 exit gate is "one command regenerates all figures". This runs that command with
        # no arguments, which is the form a reader will use, and fails if any figure draws a
        # number that traces to neither results/paper_numbers.json nor a committed result table.
        #
        # It deliberately does NOT diff against the committed figures/. Byte-determinism is
        # asserted within one platform (tests/test_make_figures.py); cross-OS byte identity of
        # PDF font subsets is not something this project has demonstrated, and invariant 5
        # already scopes bit-identity rather than claiming it everywhere.
        run: uv run python scripts/make_figures.py

  inference-cpu:
    # Runs the P5 gate: determinism, sequence log-probs, and the resumable harness, on CPU.
    #
    # It loads a model, but a TINY one. `hf-internal-testing/tiny-random-LlamaForCausalLM` is a few
    # megabytes, randomly initialised, and ungated -- which matters because this job has no HF
    # token and therefore cannot reach the gated Meta pins the dev box uses. Its outputs are
    # meaningless by construction, and that is fine: these tests check the HARNESS, not the model.
    #
    # There is still NO GPU here (PROJECT_CONTEXT.md section 7). The NF4 path is exercised on
    # Kaggle, never in CI, and the docs must not imply otherwise. On this runner the backend falls
    # back to an unquantized load and records that it did.
    name: inference extra (CPU only, no GPU on GitHub runners)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'inference-ci')
    env:
      MARGINS_TEST_MODEL: tiny_random_llama
      # Pinned: the determinism claim holds at a FIXED thread count, so a runner that varies its
      # core count would make the claim uncheckable rather than false.
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync with the inference extra
        run: uv sync --locked --extra dev --extra inference

      - name: Report the environment the determinism claim depends on
        run: uv run python -c "import torch, transformers; print(torch.__version__, transformers.__version__, torch.get_num_threads())"

      # `data/` is gitignored and regenerable, so the LDNOOBW wordlist the lexicon scorer loads
      # is absent on a fresh runner and its P6 probe test cannot run. This job had been failing
      # on exactly that since P6.
      #
      # `--fetch-pinned`, NOT `--write`: `--write` resolves upstream HEAD and re-pins, which on a
      # machine would silently fetch whatever the wordlist looks like today and score against a
      # version nobody recorded. This mode downloads at the revision the roster already pins and
      # refuses to write on a digest mismatch (CLAUDE.md: never unpin to make it work).
      - name: Fetch the scoring lexicons at their PINNED revisions
        run: uv run python scripts/fetch_lexicons.py --fetch-pinned

      # Same story for the extractive source (P2). `data/` is gitignored, so the pinned
      # CrowS-Pairs CSV is absent on a fresh runner and the loader's real-file tests skip
      # themselves -- including "row counts match the published dataset", which is a P2 gate
      # clause. Fetching it here is what makes those tests actually run somewhere.
      #
      # `--fetch-pinned`, NOT `--write`, for exactly the reason the lexicon step gives: `--write`
      # resolves upstream HEAD and re-pins, which would silently score against whatever the
      # dataset looks like today. This mode downloads at the recorded revision and refuses on a
      # digest mismatch.
      #
      # It stays in the NIGHTLY job rather than the core one on purpose: the core job is hermetic
      # on both OSes, and adding a network dependency to it would trade a real property for a
      # marginally earlier signal.
      - name: Fetch the CrowS-Pairs dataset at its PINNED revision
        run: uv run python scripts/fetch_crows_pairs.py --fetch-pinned

      - name: pytest (includes the inference-marked P5 gate tests)
        run: uv run pytest -q
