[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "margins"
version = "0.1.0"
description = "Mapping the Margins — a reproducible framework for intersectional bias auditing of open-weight LLMs."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Reenu Biju", email = "reenubiju10@gmail.com" }]

# Ranges only — never unpinned. `uv.lock` resolves these to exact versions for the two
# environments declared in [tool.uv]. If a range fails to resolve, surface it; do not widen it.
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<0.15",
    "pingouin>=0.5.4,<0.6",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "jinja2>=3.1,<4",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
# Every inference dep is Linux-gated. The 7-8B sweep never runs on the Windows dev box
# (PROJECT_CONTEXT.md §7), and gating here is what stops `uv lock` from hunting for a
# `bitsandbytes` win_amd64 wheel — i.e. it removes the pressure to unpin.
inference = [
    "torch>=2.3,<3; sys_platform == 'linux'",
    "transformers>=4.44,<5; sys_platform == 'linux'",
    "accelerate>=0.33,<2; sys_platform == 'linux'",
    "bitsandbytes>=0.43,<0.48; sys_platform == 'linux'",
    "datasets>=2.20,<4; sys_platform == 'linux'",
    "evaluate>=0.4,<0.5; sys_platform == 'linux'",
    "detoxify>=0.5,<0.6; sys_platform == 'linux'",
]
# Documented pure-CPU / Apple fallback backend behind the same interface (§6).
llamacpp = [
    "llama-cpp-python>=0.2.90,<0.4",
]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<0.15",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/margins"]

[tool.uv]
# Exactly the two locked environments (§7). Declaring them is the supported way to keep
# resolution honest on Windows without touching a version bound.
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["hydra.*", "omegaconf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
