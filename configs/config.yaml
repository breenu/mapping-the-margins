# Hydra root config. Deliberately PLAIN YAML: Hydra composes, the result is converted to a
# plain dict, and margins.config.config_from_mapping validates it into ExperimentConfig.
# No Hydra structured configs, no hydra-zen (PROJECT_CONTEXT.md section 6).

seed: 20260908
run_name: default

output_dir: outputs
data_dir: data
results_dir: results

# Fixed recorded constant, not an experimental axis (CLAUDE.md framing constraint 4).
quant: nf4

# Which identity lattice this run audits. The NAME goes here; the file's sha256 goes into the
# run manifest's input_checksums (key `lattice_config`), because a name alone would not survive
# an edit to the file. Added at P4a to close that provenance hole.
#
# `lattice_name`, not `lattice`: `configs/lattice/` is a Hydra config GROUP, and a key colliding
# with a group name cannot be overridden from the command line at all.
lattice_name: confirmatory_v1

# Which checkpoint and which decoding profile this run uses (added at P5). The NAMES go here; each
# file's sha256 goes into the manifest's input_checksums, because a name alone would not survive an
# edit to the file.
#
# `model_name`/`decoding_name`, not `model`/`decoding`: `configs/model/` and `configs/decoding/` are
# Hydra config GROUPS, and a key colliding with a group name cannot be overridden from the command
# line at all. Same lesson as `lattice_name`.
#
# `model_name: null` is the default because most runs load no model (prompt generation, exports).
# `scripts/run_inference.py` sets it.
model_name: null
decoding_name: greedy_v1

# Open decision #2 CLOSED at P5 (9 Sep 2026): Llama-3.1-8B-Instruct + Mistral-7B-Instruct-v0.3
# confirmatory, Llama-3.2-1B-Instruct for dev. The pinned revision shas live in
# `configs/model/<name>.yaml`, resolved by `scripts/pin_models.py` and never hand-authored. These
# two fields are populated PER RUN from the resolved ModelSpec, so the manifest's serialised config
# states the exact checkpoint that ran.
model_id: null
model_revision: null

manifest:
  write_manifest: true
  manifest_subdir: run_manifests
  record_environment_fingerprint: true
