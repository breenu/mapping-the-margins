# Hydra root config. Deliberately PLAIN YAML: Hydra composes, the result is converted to a
# plain dict, and margins.config.config_from_mapping validates it into ExperimentConfig.
# No Hydra structured configs, no hydra-zen (PROJECT_CONTEXT.md section 6).

seed: 20260908
run_name: default

output_dir: outputs
data_dir: data
results_dir: results

# Fixed recorded constant, not an experimental axis (CLAUDE.md framing constraint 4).
quant: nf4

# Which identity lattice this run audits. The NAME goes here; the file's sha256 goes into the
# run manifest's input_checksums (key `lattice_config`), because a name alone would not survive
# an edit to the file. Added at P4a to close that provenance hole.
#
# `lattice_name`, not `lattice`: `configs/lattice/` is a Hydra config GROUP, and a key colliding
# with a group name cannot be overridden from the command line at all.
lattice_name: confirmatory_v1

# Which checkpoint and which decoding profile this run uses (added at P5). The NAMES go here; each
# file's sha256 goes into the manifest's input_checksums, because a name alone would not survive an
# edit to the file.
#
# `model_name`/`decoding_name`, not `model`/`decoding`: `configs/model/` and `configs/decoding/` are
# Hydra config GROUPS, and a key colliding with a group name cannot be overridden from the command
# line at all. Same lesson as `lattice_name`.
#
# `model_name: null` is the default because most runs load no model (prompt generation, exports).
# `scripts/run_inference.py` sets it.
model_name: null
decoding_name: greedy_v1

# Which scorer roster this run uses (added at P6). Same story once more: `configs/scoring/` is a
# Hydra config GROUP, so the key is `scoring_name`. The roster file's sha256 goes into the manifest
# under `scoring_config`, and each fetched lexicon's under `scorer:<scorer_id>` -- a roster NAME
# alone would not survive a re-pin, and a re-pinned scorer is a different instrument.
#
# It is a plain default rather than null: unlike a model, every scoring run uses a roster, and the
# key must exist here at all for `scoring_name=...` to be overridable from the command line.
scoring_name: default_v1

# Which metrics config -- bootstrap replicates, CI level, seed, and the PLACEHOLDER drift
# thresholds -- this run fits under (added at P7). `metrics_name` for the same reason as every
# `_name` above: `configs/metrics/` is a Hydra config GROUP. The file's sha256 goes into the
# manifest under `metrics_config`, beside the digests of the two P6 tables the run consumed.
metrics_name: emergence_v1

# Which stats config -- alpha, the FDR family definition, the permutation scheme, the power
# settings and the PRE-REGISTERED drift-enforcement threshold -- this run declares significance
# under (added at P9). `stats_name` for the same reason as every `_name` above: `configs/stats/`
# is a Hydra config GROUP. Its sha256 goes into the manifest under `stats_config`.
stats_name: confirmatory_v1

# Which EXTRACTIVE benchmark this run ingests (added at P2). `benchmark_name` for the same reason
# as every `_name` above: `configs/benchmark/` is a Hydra config GROUP, and a key colliding with a
# group name cannot be overridden from the command line at all.
#
# `null` by default, and unlike the other groups deliberately so: most runs ingest no benchmark.
# The generation vertical never touches one, and a run naming a source it did not read would put
# a checksum in its manifest for a file it never opened. `scripts/build_crows_items.py` sets it.
benchmark_name: null

# Which RED-TEAM set this run generates from (added at P8). `redteam_name` for the same reason as
# every `_name` above: `configs/redteam/` is a Hydra config GROUP.
#
# `null` by default, like `benchmark_name`: most runs generate no frames. The red-team build
# scripts set it. Its sha256, and each elicitation template's, go into the manifest inputs --
# because WHAT THE RED LM WAS ASKED is the red-team prompt distribution, which is the contribution
# of P8 and the one thing about it a reproducer most needs to be able to check.
redteam_name: null

# Open decision #2 CLOSED at P5 (9 Sep 2026): Llama-3.1-8B-Instruct + Mistral-7B-Instruct-v0.3
# confirmatory, Llama-3.2-1B-Instruct for dev. The pinned revision shas live in
# `configs/model/<name>.yaml`, resolved by `scripts/pin_models.py` and never hand-authored. These
# two fields are populated PER RUN from the resolved ModelSpec, so the manifest's serialised config
# states the exact checkpoint that ran.
model_id: null
model_revision: null

manifest:
  write_manifest: true
  manifest_subdir: run_manifests
  record_environment_fingerprint: true
