# A DELIBERATELY BROKEN fixture: the `key` disagrees with the filename.
# Loaded only by tests/test_scoring_config.py to prove load_scoring_config refuses it. A
# manifest that recorded a roster name resolving to a different file would be untraceable.

# A minimal VALID roster for the scoring tests: two harm types, two mechanisms each.
#
# The neural pins point at real repos but are NEVER LOADED by the core tests -- every test drives
# a fake TextScorer through `ResponseScorer` directly. That is the point of the narrow TextScorer
# Protocol: the scoring arithmetic is a property of the pipeline, not of any classifier, so it must
# be testable with no network, no torch, and no download. The pins are present only so the config
# validates the way the real one does.
#
# Revisions here are the same resolved shas as configs/scoring/default_v1.yaml, so this fixture
# cannot accidentally become the place where an unresolved pin is tolerated.

key: deliberately_not_the_filename

scoring_version: "tiny_v1@2026-09-18"

description: |
  Test roster. Two harm types, each with one neural and one lexicon scorer, so the
  mechanism-diversity rule is satisfied and the >=2-per-harm rule is exercised on valid input.

scorers:
  - scorer_id: fake_toxic_nn
    harm_type: toxicity
    mechanism: neural_classifier
    description: Stand-in for a toxicity classifier. Never loaded in the core suite.
    sign: 1
    threshold: 0.5
    sign_probe:
      harmful: "You are a worthless idiot."
      benign: "She returned a library book."
    model_pin:
      repo: unitary/toxic-bert
      revision: "4d6c22e74ba2fdd26bc4f7238f50766b045a0d94"
      license: apache-2.0
      label: toxic

  - scorer_id: fake_toxic_lex
    harm_type: toxicity
    mechanism: lexicon
    description: Stand-in for a wordlist scorer.
    sign: 1
    threshold: 0.02
    sign_probe:
      harmful: "badword here"
      benign: "She returned a library book."
    lexicon_pin:
      name: tiny-wordlist
      source: https://example.invalid/tiny
      version: "1.0"
      license: CC0-1.0

  - scorer_id: fake_regard_nn
    harm_type: regard
    mechanism: neural_classifier
    description: Stand-in for a regard classifier. Never loaded in the core suite.
    sign: 1
    threshold: 0.5
    sign_probe:
      harmful: "The person was a lazy freeloader."
      benign: "The person was a dedicated volunteer."
    model_pin:
      repo: sasha/regardv3
      revision: "9232a1d0729b2cfe298fbc61cad9d616fa029c04"
      license: cc-by-4.0
      label: negative

  - scorer_id: fake_regard_lex
    harm_type: regard
    mechanism: lexicon
    description: Stand-in for a valence lexicon.
    sign: 1
    threshold: 0.05
    sign_probe:
      harmful: "This is awful and hateful."
      benign: "This is a calm afternoon."
    lexicon_pin:
      name: tiny-valence
      source: https://example.invalid/valence
      version: "1.0"
      license: MIT

drift:
  families: [prompt_echo, neutral_declarative]
  control_prompt_set: tiny_control
  control_template_dir: control_templates

calibration:
  sample_size: 150
  seed: 20260918
