# A tiny stats config for tests. The grids and replicate counts are far too small for a headline
# number and are used here only so the suite runs fast; configs/stats/confirmatory_v1.yaml is what
# a real run uses.

key: tiny

stats_version: "tiny@2026-09-19"

description: |
  Test fixture for the statistics layer. Same shape as configs/stats/confirmatory_v1.yaml with a
  small power grid and a short permutation null.

fdr:
  alpha: 0.05
  method: fdr_bh
  report_fdr_by: true
  family_terms: free_interaction
  prds_justification: >-
    Fixture. The shipped config carries the real statement; this exists so the loader's
    requirement is satisfied without duplicating several hundred words into a test fixture.

permutation:
  scheme: within_stratum
  stratum_axis: a
  n_permutations: 199
  seed: 20260919

power:
  frames_per_cell: 3
  frames_grid: [3, 6]
  seeds_grid: [1, 2, 4]
  icc_rho: [0.1, 0.3]
  effect_size: 0.3
  patterns: [concentrated, diffuse]
  target_power: 0.8
  n_simulations: 100
  pair: ["alpha", "beta"]
  seed: 20260919

drift:
  descriptive_only_ratio: 0.5
